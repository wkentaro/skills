name: Invocation metadata

on:
  pull_request:
    paths:
      - ".github/workflows/invocation-metadata.yml"
      - "skills/**/SKILL.md"
      - "skills/**/agents/openai.yaml"
      - "tests/invocation_metadata_test.sh"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/invocation-metadata.yml"
      - "skills/**/SKILL.md"
      - "skills/**/agents/openai.yaml"
      - "tests/invocation_metadata_test.sh"

permissions:
  contents: read

jobs:
  test:
    name: Invocation metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n tests/invocation_metadata_test.sh
      - name: Lint shell
        run: shellcheck tests/invocation_metadata_test.sh
      - name: Run invocation metadata audit
        run: tests/invocation_metadata_test.sh
